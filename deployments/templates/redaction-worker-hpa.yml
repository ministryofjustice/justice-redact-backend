apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: justice-redact-redaction-worker
  namespace: ${NAMESPACE}

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: justice-redact-redaction-worker

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: redaction-worker
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300