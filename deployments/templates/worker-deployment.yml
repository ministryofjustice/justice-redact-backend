apiVersion: apps/v1
kind: Deployment
metadata:
  name: justice-redact-worker
  namespace: ${NAMESPACE}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: justice-redact-worker

  template:
    metadata:
      labels:
        app: justice-redact-worker

    spec:
      terminationGracePeriodSeconds: 1800
      
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      serviceAccountName: ${SERVICE_ACCOUNT}

      containers:
        - name: worker
          image: ${IMAGE}
          imagePullPolicy: Always

          command:
            - python
            - -m
            - app.workers.document_processing_worker

          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

            - name: logs
              mountPath: /var/log/app

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: s3-bucket-output
                  key: bucket_name

            - name: S3_REGION
              value: "eu-west-2"

            - name: SQS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: justice-redact-sqs
                  key: queue_url

            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: rds-postgresql-instance-output
                  key: rds_instance_address

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: rds-postgresql-instance-output
                  key: database_name

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rds-postgresql-instance-output
                  key: database_username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-postgresql-instance-output
                  key: database_password

            - name: AP_COMPREHEND_ROLE_ARN
              value: "arn:aws:iam::593291632749:role/alpha_app_justice-redact-backend"

        - name: fluent-bit
          image: fluent/fluent-bit:3.1
          imagePullPolicy: Always

          env:
            - name: OPENSEARCH_PROXY_HOST
              valueFrom:
                secretKeyRef:
                  name: opensearch-output
                  key: proxy_host

            - name: OPENSEARCH_PROXY_PORT
              valueFrom:
                secretKeyRef:
                  name: opensearch-output
                  key: proxy_port

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: logs
              mountPath: /var/log/app
              readOnly: true

            - name: fluent-bit-config
              mountPath: /fluent-bit/etc
              readOnly: true

            - name: fluent-bit-storage
              mountPath: /var/log/flb-storage

      volumes:
        - name: tmp
          emptyDir: {}

        - name: logs
          emptyDir: {}

        - name: fluent-bit-config
          configMap:
            name: worker-fluent-bit-config

        - name: fluent-bit-storage
          emptyDir: {}