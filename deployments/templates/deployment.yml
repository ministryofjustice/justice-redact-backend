apiVersion: apps/v1
kind: Deployment
metadata:
  name: justice-redact-backend
  namespace: ${NAMESPACE}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: justice-redact-backend
  template:
    metadata:
      labels:
        app: justice-redact-backend
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      containers:
        - name: app
          image: ${IMAGE}
          ports:
            - containerPort: 3000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
