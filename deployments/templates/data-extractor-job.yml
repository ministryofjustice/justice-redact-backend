apiVersion: batch/v1
kind: CronJob
metadata:
  name: justice-redact-data-extractor
  namespace: ${NAMESPACE}
  labels:
    app: justice-redact-data-extractor

spec:
  # Daily export to the Register My Data landing bucket (01:00).
  schedule: "0 1 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid

  # Count a run as missed if the Job can't be created within this 2 minute window.
  startingDeadlineSeconds: 120

  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: justice-redact-data-extractor

        spec:
          restartPolicy: Never

          # Apply the restricted-compatible seccomp profile to all pod containers.
          securityContext:
            seccompProfile:
              type: RuntimeDefault

          # Same IRSA service account as the backend (kept for consistency; the
          # extractor itself authenticates to S3 with the static keys below).
          serviceAccountName: ${SERVICE_ACCOUNT}

          containers:
            - name: data-extractor
              # Pinned image, as used in the Cloud Platform guide's example job.
              image: ministryofjustice/data-engineering-data-extractor:v1
              imagePullPolicy: Always

              # Extract table names, dump each table to JSON lines, then copy to S3.
              args: ["extract_table_names.py && extract_pg_jsonl_snapshot.py && transfer_local_to_s3.sh"]

              # Restricted, non-root. readOnlyRootFilesystem is left off because the
              # extractor writes its dump files locally before uploading — see notes.
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 10001
                capabilities:
                  drop:
                    - ALL

              volumeMounts:
                # The extractor writes events.log and its local snapshot files
                # under /db-exporter before uploading to S3 — give it somewhere
                # writable rather than loosening the rest of the security context.
                - name: tmp
                  mountPath: /db-exporter

              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 6Gi # Increased from 3Gi to accommodate the extractor's memory usage when dumping large tables.

              env:
                # --- PostgreSQL connection (source: rds-postgresql-instance-output) ---
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-output
                      key: rds_instance_address

                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-output
                      key: database_name

                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-output
                      key: database_username

                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-output
                      key: database_password

                # --- S3 destination (source: analytical-platform-reporting-s3-bucket) ---
                - name: S3_DESTINATION
                  valueFrom:
                    secretKeyRef:
                      name: analytical-platform-reporting-s3-bucket
                      key: destination_bucket

                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: analytical-platform-reporting-s3-bucket
                      key: access_key_id

                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: analytical-platform-reporting-s3-bucket
                      key: secret_access_key

                - name: AWS_DEFAULT_REGION
                  value: eu-west-2

                # Set in the guide's example job. Not confirmed what it does for your
                # service — check the extractor README before enabling.
                # - name: SAVE_EVENTS_LOG
                #   value: "true"

          volumes:
            - name: tmp
              emptyDir: {}