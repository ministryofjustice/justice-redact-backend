apiVersion: batch/v1
kind: CronJob
metadata:
  name: justice-redact-data-extractor
  namespace: ${NAMESPACE}
  labels:
    app: justice-redact-data-extractor

spec:
  schedule: "0 1 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120

  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: justice-redact-data-extractor

        spec:
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault

          serviceAccountName: ${SERVICE_ACCOUNT}

          containers:
            - name: data-extractor
              # REPLACED: Use your own built ECR image instead of the deprecated external dependency
              image: ${IMAGE}
              imagePullPolicy: Always

              # Run your custom internal extraction script
              command: ["python", "app/cli/data_extractor.py"]

              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 10001
                capabilities:
                  drop:
                    - ALL

              volumeMounts:
                - name: tmp
                  mountPath: /db-exporter

              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 6Gi

              env:
                - name: PYTHONUNBUFFERED
                  value: "1"

                # --- PostgreSQL connection ---
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-output
                      key: rds_instance_address

                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-output
                      key: database_name

                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-output
                      key: database_username

                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-output
                      key: database_password

                # --- S3 destination ---
                - name: S3_DESTINATION
                  valueFrom:
                    secretKeyRef:
                      name: analytical-platform-reporting-s3-bucket
                      key: destination_bucket

                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: analytical-platform-reporting-s3-bucket
                      key: access_key_id

                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: analytical-platform-reporting-s3-bucket
                      key: secret_access_key

                - name: AWS_DEFAULT_REGION
                  value: "eu-west-2"

          volumes:
            - name: tmp
              emptyDir: {}