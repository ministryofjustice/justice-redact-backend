name: 'Create GitHub Release'

on:
  push:
    tags:
      - 'v[0-9].*' # Triggers on semantic version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write # Required to create releases and generate release notes

jobs:
  release:
    name: 'Create Release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # SHA pinned for security
        with:
          fetch-depth: 0 # Fetches full history so release notes can compare commits

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Automatically generates release notes from PR titles and commit messages
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes