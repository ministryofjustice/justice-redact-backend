# 2. Configure AWS credentials using OIDC (Skipped on PRs to prevent AssumeRole errors)
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ needs.set-environment.outputs.target_env == 'staging' && 'eu-west-2' || vars.ECR_REGION }}

      # 3. Log into Amazon ECR (Skipped on PRs)
      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build the image (Local-only for PRs, Builds & Pushes for branch merges)
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: justice-redact-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "📊 PR Detected: Building Docker image locally to verify compilation stability..."
            docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
            echo "✅ Local build successful! Skipping ECR push for PR security."
          else
            echo "🚀 Branch Push Detected: Building and pushing to AWS ECR registry..."
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          fi

