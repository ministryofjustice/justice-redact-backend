name: Build, Push & Deploy Backend

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read  # Required to checkout the repository code

jobs:
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.branch-check.outputs.env_name }}
    steps:
      - id: branch-check
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "env_name=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "env_name=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
          fi

  ecr_and_deploy:
    needs: set-environment
    runs-on: ubuntu-latest
    # Only bind to an environment context on valid direct pushes
    environment: ${{ github.event_name == 'push' && needs.set-environment.outputs.target_env || '' }}

    steps:
      # 1. Checkout Application Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials via OIDC (Only runs on direct pushes/merges)
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: eu-west-2

      # 3. Log into Amazon ECR (Only runs on direct pushes/merges)
      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker Image (Local verification for PRs, Remote Push for Merges)
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: justice-redact-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "🚀 Push Event Detected: Delivering image to AWS ECR..."
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          else
            echo "📊 Pull Request Detected: Validating image build stability locally..."
            docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
            echo "✅ Local compilation successful! Skipping ECR registry push for security."
          fi

      # 5. Authenticate & Deploy to Kubernetes Cluster (Only runs on direct pushes/merges)
      - name: Deploy to Cloud Platform Kubernetes Cluster
        if: github.event_name == 'push'
        uses: bitovi/github-actions-deploy-eks-helm@v1.2.8
        with:
          name: justice-redact-backend
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: eu-west-2
          cluster-name: ${{ secrets.KUBE_CLUSTER }}
          config-files: .metadata/kubeconfig
          chart-path: helm/justice-redact-backend
          namespace: ${{ secrets.KUBE_NAMESPACE }}
          values: |
            image:
              repository: ${{ steps.login-ecr.outputs.registry }}/justice-redact-backend
              tag: ${{ github.sha }}