[project]
name = "justice-redact-backend"
version = "0.1.0"
description = "Backend API for Justice Redact"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "justice-redact",
    "sqlalchemy",
    "psycopg[binary]",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
system-certs = true
package = false

[tool.uv.sources]
justice-redact = { git = "https://github.com/moj-analytical-services/justice-redact.git", rev = "0dd5c31061aedd70be3bd4c6182a4688ce14cb43" }
